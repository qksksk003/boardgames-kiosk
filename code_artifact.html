        ];

        // --- Visitor Counter Logic with LocalStorage ---
        const todayKey = new Date().toISOString().split('T')[0];
        let visitorData = JSON.parse(localStorage.getItem('popcorn_visitor_data')) || { date: todayKey, count: 0 };

        if (visitorData.date !== todayKey) {
            visitorData = { date: todayKey, count: 0 };
            localStorage.setItem('popcorn_visitor_data', JSON.stringify(visitorData));
        }

        function updateVisitorDisplay() {
            document.getElementById('visitorDisplay').innerText = `${visitorData.count} 명째 방문 중!`;
        }

        function incrementVisitor() {
            visitorData.count += 1;
            localStorage.setItem('popcorn_visitor_data', JSON.stringify(visitorData));
            updateVisitorDisplay();
        }

        updateVisitorDisplay();

        // --- Helper Function to Render Game Cards ---
        function renderGameCards(games, isLucky = false, messageTitle = "") {
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '';

            if (messageTitle) {
                const noticeBox = document.createElement('div');
                noticeBox.className = "bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl font-medium text-sm flex items-center gap-2";
                noticeBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${messageTitle}`;
                resultsArea.appendChild(noticeBox);
            }

            if (games.length === 0) {
                resultsArea.innerHTML += `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-2xl text-center font-medium text-sm">
                        😢 조건에 일치하는 게임을 찾지 못했습니다. 다른 조건을 선택해 보세요!
                    </div>
                `;
                return;
            }

            games.forEach(game => {
                const titleEmoji = isLucky ? "🏆" : "🎲";
                const fallbackImg = `https://placehold.co/200x240/F1F5F9/64748B?text=${encodeURIComponent(game.name)}`;
                
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-5 items-center";
                
                card.innerHTML = `
                    <div class="w-full sm:w-1/3 flex justify-center items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <img src="${game.image}" onerror="this.src='${fallbackImg}'" alt="${game.name}" class="max-h-[160px] object-contain rounded-lg shadow-xs">
                    </div>
                    <div class="w-full sm:w-2/3 flex flex-col gap-2">
                        <h4 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <span>${titleEmoji}</span> ${game.name}
                        </h4>
                        <div class="text-sm text-slate-600 flex flex-col gap-1.5">
                            <div>🏷️ <strong class="text-slate-700">장르</strong> : ${game.genre.join(', ')}</div>
                            <div>⏱️ <strong class="text-slate-700">시간</strong> : ${game.time}</div>
                            <div>👥 <strong class="text-slate-700">인원</strong> : ${game.display_players}</div>
                            <div>📍 <strong class="text-slate-700">가격</strong> : <span class="text-red-500 font-bold">${game.location}</span></div>
                        </div>
                    </div>
                `;
                resultsArea.appendChild(card);
            });
        }

        // --- Real-time Search Function ---
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const searchMessage = document.getElementById('searchMessage');

            if (!query) {
                searchMessage.innerHTML = "💡 위의 검색창에 게임 이름을 입력하시면 상세 정보를 바로 확인할 수 있습니다!";
                document.getElementById('resultsArea').innerHTML = '';
                return;
            }

            const matched = gamesData.filter(game => game.name.toLowerCase().includes(query));
            searchMessage.innerHTML = `<strong>'${query}'</strong> 검색 결과 (${matched.length}건)`;
            renderGameCards(matched, false, `'${query}' 검색 결과입니다.`);
        }

        // --- Filter & Recommendation Logic ---
        function resetRecommendation() {
            // Optional callback when dropdown options change
        }

        function getRecommendations(isLucky) {
            const players = document.getElementById('playerSelect').value;
            const genre = document.getElementById('genreSelect').value;

            const filtered = gamesData.filter(game => {
                const matchPlayers = (players === "전체") || game.players.includes(players);
                const matchGenre = (genre === "전체") || game.genre.includes(genre);
                return matchPlayers && matchGenre;
            });

            if (isLucky) {
                if (filtered.length > 0) {
                    const randomGame = filtered[Math.floor(Math.random() * filtered.length)];
                    renderGameCards([randomGame], true, "🔮 오늘의 운명적인 추천 게임은 바로!");
                } else {
                    renderGameCards([], false);
                }
            } else {
                renderGameCards(filtered, false, `🎯 [${players} / ${genre}] 조건에 맞는 추천 게임입니다!`);
            }
        }

        function clearRecommendationResults() {
            document.getElementById('resultsArea').innerHTML = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchMessage').innerHTML = "💡 위의 검색창에 게임 이름을 입력하시면 상세 정보를 바로 확인할 수 있습니다!";
            document.getElementById('playerSelect').value = "전체";
            document.getElementById('genreSelect').value = "전체";
        }
    </script>
</body>
</html>
